# Fly.io 配置文件
app = "st-api-service"
primary_region = "nrt"  # 东京，亚洲访问快

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_URL = "sqlite+aiosqlite:////data/api_service.db"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "st_data"
  destination = "/data"
